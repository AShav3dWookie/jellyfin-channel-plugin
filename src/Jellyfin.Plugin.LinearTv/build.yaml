overview: "Pre-built live TV channels, played from files."
description: >
  Plays channels built offline as live TV. Each channel is one continuous MPEG-TS in a single
  format, built from a lineup of films and episodes on another machine and copied into a store
  folder. Channels appear natively in the Live TV guide, cannot be sought, and play seamlessly
  from one programme to the next whatever the original files' formats. The server does no
  encoding: it reads the channel's file at real-time pace.
category: "LiveTV"
artifacts:
  - "Jellyfin.Plugin.LinearTv.dll"
changelog: >
  1.0 is a new design. Channels are no longer configured on the settings page or joined from the
  library at play time: they are built on a PC with linear-tv-builder into one continuous 720p
  H.265 stream per channel (original-language audio, AAC stereo 192 kb/s; English subtitles
  burned in for foreign audio, forced subtitles otherwise) and copied into the store folder set
  on the settings page. Programme changes no longer stop the stream, every source format plays,
  and the server encodes nothing. Channels from 0.x are not carried over: rebuild them from their
  channel files. Clients that can't play H.265 are transcoded by Jellyfin.
