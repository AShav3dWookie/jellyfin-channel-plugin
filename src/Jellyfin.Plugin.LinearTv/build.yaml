overview: "Pseudo live TV channels built from your library."
description: >
  Turns library content into tunable pseudo live TV channels with a wall-clock schedule.
  Channels appear natively in the Live TV guide, cannot be sought, and play on from one
  programme to the next. The plugin never decodes or encodes video: it joins Jellyfin's own
  stream copies end to end, and any transcoding is done by Jellyfin.
category: "LiveTV"
artifacts:
  - "Jellyfin.Plugin.LinearTv.dll"
changelog: >
  Channels can now be imported and exported as JSON, so they can be written outside Jellyfin
  (by hand, by script, or by an AI given a list of the library) and loaded without restarting.
  POST /LinearTv/Channels/Import and GET /LinearTv/Channels/Export are for administrators only.
  Content is named by title and year, or by series, season and episode, so a file works on any
  server. Matching forgives case, punctuation, accents and a year off by one; anything
  ambiguous or missing is refused with suggestions. Imports are all or nothing, can be dry
  runs, and either merge by channel number or replace the whole list.
