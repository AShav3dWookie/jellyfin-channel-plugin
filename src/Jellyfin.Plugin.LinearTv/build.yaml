overview: "Pre-built live TV channels, played from files."
description: >
  Plays channels built offline as live TV. Each channel is one continuous MPEG-TS in a single
  format, built from a lineup of films and episodes on another machine and copied into a store
  folder. Channels appear natively in the Live TV guide, cannot be sought, and play seamlessly
  from one programme to the next whatever the original files' formats. The server does no
  encoding: it reads the channel's file at real-time pace.
category: "LiveTV"
artifacts:
  - "Jellyfin.Plugin.LinearTv.dll"
changelog: >
  Channels for IPTV apps, for one-press channel up/down: an M3U playlist at
  /LinearTv/Iptv/channels.m3u?ApiKey=<key>, with an XMLTV guide a week ahead and each channel's
  stream at a fixed address. Point an IPTV app (such as webOS IPTV Player on an LG TV) at the
  playlist; it plays the channels directly, with no transcoding, alongside Live TV.
