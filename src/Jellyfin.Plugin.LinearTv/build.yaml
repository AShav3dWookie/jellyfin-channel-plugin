overview: "Pre-built live TV channels, played from files."
description: >
  Plays channels built offline as live TV. Each channel is one continuous MPEG-TS in a single
  format, built from a lineup of films and episodes on another machine and copied into a store
  folder. Channels appear natively in the Live TV guide, cannot be sought, and play seamlessly
  from one programme to the next whatever the original files' formats. The server does no
  encoding: it reads the channel's file at real-time pace.
category: "LiveTV"
artifacts:
  - "Jellyfin.Plugin.LinearTv.dll"
changelog: >
  Channels now direct-play in the LG webOS app and other clients built on jellyfin-web: they
  were given Jellyfin's address from inside its host (in Docker, a container address no other
  device can reach) and span forever. Each client now gets the address it reached Jellyfin by.
  Tuning straight after a Jellyfin restart, before the first guide refresh, no longer fails. The
  join threshold now defaults to 0: tuning in always joins where the broadcast is, end credits
  included, like real TV.
